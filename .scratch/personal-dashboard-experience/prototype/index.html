<!doctype html>
<!-- THROWAWAY: Three structurally different renderings in the current Dashboard shell.
     Question: Can broad plans, precise Tasks and a conversation-first workspace be easier to use?
     Same route ?page=today|tasks|calendar|collaboration&variant=A|B|C. Synthetic state only. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Dashboard 体验原型</title><link rel="stylesheet" href="/__app/styles.css"><link rel="stylesheet" href="prototype.css"></head>
<body class="experience-prototype"><main class="app-shell" data-workspace-destination="today">
  <header class="product-toolbar"><div class="product-toolbar-brand"><div class="feature-mark">P</div><div><p class="product-toolbar-name">Personal Dashboard</p><p class="product-toolbar-area">每日生活</p></div></div><span class="product-toolbar-space"></span><span class="demo-badge">体验原型 · 示例数据 · 不保存</span></header>
  <aside class="workspace-sidebar"><div class="workspace-rail-context"><p class="section-label">SAT · OCT 10</p><strong>周六，10 月 10 日</strong><small>早晨 · 白天 · 晚间</small></div><nav class="workspace-navigation">
    <button class="destination-button" data-page="today"><span class="destination-icon">☀</span><span>今天</span></button>
    <button class="destination-button" data-page="tasks"><span class="destination-icon">□</span><span>任务</span></button>
    <button class="destination-button" data-page="calendar"><span class="destination-icon">▦</span><span>日历</span></button>
    <button class="destination-button" data-page="collaboration"><span class="destination-icon">↗</span><span>协作</span></button>
  </nav><div class="sidebar-status"><p>所有演示只在内存中。</p><small>可切换页面和布局，刷新还原。</small></div></aside>
  <section class="prototype-workspace"><div id="page"></div></section>
</main>
<div class="prototype-switcher"><button id="previous" aria-label="上一个方案">←</button><div><b id="variant-name"></b><small id="variant-description"></small></div><button id="next" aria-label="下一个方案">→</button><button id="inspect">演示状态</button><button id="reset">还原</button></div>
<dialog id="detail-dialog"></dialog><dialog id="state-dialog"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="prototype.js"></script></body></html>
