or:#2d6c57}.legend span:last-child{color:#7b6843}.scroller{height:510px;overflow:auto;position:relative;padding:0 16px 24px 4px}.axis{position:relative;margin:20px 8px 12px 64px;height:1020px}.gridline{position:absolute;left:0;right:0;border-top:1px solid #e9ebe7}.tick{position:absolute;right:calc(100% + 12px);top:-8px;color:#737b75;font-size:11px;font-variant-numeric:tabular-nums}.lane-divider{position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #e6e8e3}.event{position:absolute;border-radius:6px;padding:7px 10px;font-size:12px;overflow:hidden;border:1px solid #cbded2;background:#e7f0eb;color:#214e43;text-align:left}.event strong{display:block;font-size:13px;margin-top:4px}.event.plan{background:#f6f2e8;border:1px dashed #bcb092;color:#695b40}.now{position:absolute;left:0;right:0;border-top:2px solid #bd4b3b;z-index:3;pointer-events:none}.now span{position:absolute;right:0;bottom:4px;color:#b14637;background:#fff8f3;padding:2px 6px;font-size:11px}.now:before{content:"";position:absolute;width:8px;height:8px;background:#bd4b3b;border-radius:50%;left:-4px;top:-5px}.aside{padding:18px;line-height:1.6}.aside h3{font-size:14px;margin:0 0 12px}.note{background:#f7f7f5;padding:12px;border-radius:7px;margin:12px 0}.note small{display:block;margin-bottom:5px}.state{font-size:11px;line-height:1.7;padding:12px 16px;border-top:1px solid #e5e6e2;background:#fafaf8;color:#606763}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253d33;color:white;display:flex;align-items:center;gap:12px;padding:10px;border-radius:13px;box-shadow:0 8px 30px #0003;z-index:10;white-space:nowrap}.switcher button{background:transparent;color:white;border-color:#6d8177}.switcher b{min-width:190px;text-align:center}.horizontal{height:360px;min-width:1100px;margin:35px 35px 0 65px;position:relative}.horizontal .gridline{top:0;bottom:0;right:auto;border-top:0;border-left:1px solid #e9ebe7}.horizontal .tick{top:-22px;left:-16px;right:auto}.horizontal .now{top:0;bottom:0;right:auto;border-top:0;border-left:2px solid #bd4b3b}.horizontal .now span{left:4px;right:auto;top:0;bottom:auto;white-space:nowrap}.horizontal .now:before{top:-4px;left:-5px}.rowname{position:absolute;left:-56px;font-size:11px;color:#606763}.wide{grid-template-columns:1fr}.wide .aside{display:flex;gap:18px;align-items:center}.wide .aside .note{flex:1;margin:0}.details{min-height:42px;padding:12px 18px;background:#fafaf8;border-top:1px solid #ddd;color:#526057;font-size:12px}@media(max-width:850px){.shell{grid-template-columns:100px 1fr}nav{padding:20px 6px}main{padding:20px 14px 110px}.layout{grid-template-columns:1fr}.aside{display:none}.legend{display:none}.badge{font-size:11px}.top .muted{display:none}.switcher b{min-width:140px}}

</style>
<header><span class="logo">P</span><div><b>Personal Dashboard</b><small>每日生活</small></div><span class="badge">临时原型 · 全部为示例数据 · 不保存</span></header>
<div class="shell"><nav><small>DAILY LIFE</small><p class="active">☀　今天</p><p>▦　日历</p><p>◉　习惯</p></nav><main><div class="top"><div><small>2026 年 9 月 23 日 · 周三 · 示例日期</small><h1>今天</h1><span class="muted">看清一天走到了哪里。</span></div><span class="muted">当日情况</span></div><div class="phase"><span>早晨计划</span><strong>当日情况</strong><span>晚间复盘</span></div>
<div class="control"><label for="clock">模拟现在</label><input id="clock" type="range" min="360" max="1380" step="5" value="850"><output id="clockValue"></output><button id="focus">定位现在</button><small>拖动只移动时间线，不自动改变完成状态</small></div>
<h2 id="title"></h2><p class="intro" id="description"></p><div id="content"></div>
</main></div><div class="switcher"><button id="prev" aria-label="上一个方案">←</button><b id="variantLabel"></b><button id="next" aria-label="下一个方案">→</button></div>
<script>
const variants={A:['双栏：计划 / 实际','同一把时间尺，左边是计划，右边是已确认发生的事。空白就是没有记录；经过“现在”线的计划也不会自动变成完成。'],B:['单栏：一天的时间流','计划和事实放进同一条纵向时间轴。阅读更集中，用颜色和虚实边框区分；时间相近的条目并排避让。'],C:['横向：全天一眼看完','一天从左到右展开，计划与实际各占一行。更容易看全天节奏，但小窗口需要横向滚动。']};
const events=[{start:480,end:525,title:'阅读',kind:'plan'},{start:495,end:530,title:'已阅读 35 分钟',kind:'fact'},{start:570,end:690,title:'项目专注时间',kind:'plan'},{start:585,end:665,title:'完成方案初稿',kind:'fact'},{start:720,end:765,title:'午餐与休息',kind:'plan'},{start:725,end:770,title:'午餐、散步',kind:'fact'},{start:900,end:960,title:'整理项目资料',kind:'plan'},{start:1080,end:1140,title:'运动',kind:'plan'},{start:1260,end:1320,title:'阅读与复盘',kind:'plan'}];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';let now=850;const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;const pct=m=>(m-360)/1020*100;
function render(){document.querySelector('#title').textContent=variants[variant][0];document.querySelector('#description').textContent=variants[variant][1];document.querySelector('#variantLabel').textContent=variant+' · '+variants[variant][0].split('：')[0];const horizontal=variant==='C';document.querySelector('#content').innerHTML=`<div class="layout ${horizontal?'wide':''}"><section class="panel"><div class="panel-head"><b>${variant==='A'?'<span class="lane-head"><span>计划安排</span><span>已发生 / 已确认</span></span>':horizontal?'06:00 — 23:00 · 全天概览':'06:00 — 23:00 · 连续时间轴'}</b><div class="legend"><span>■ 已确认</span><span>▧ 计划</span></div></div><div class="scroller" ${horizontal?'style="height:420px"':''}><div class="${horizontal?'horizontal':'axis'}">${Array.from({length:18},(_,i)=>`<div class="gridline" style="${horizontal?'left':'top'}:${i/17*100}%"><span class="tick">${String(i+6).padStart(2,'0')}:00</span></div>`).join('')}${variant==='A'?'<div class="lane-divider"></div>':''}${horizontal?'<span class="rowname" style="top:85px">计划</span><span class="rowname" style="top:225px">已确认</span>':''}${events.map((e,i)=>{const lane=e.kind==='plan'?0:1;let style=horizontal?`left:${pct(e.start)}%;width:${(e.end-e.start)/1020*100}%;top:${lane?210:70}px;height:94px;padding:7px 5px`:`top:${pct(e.start)}%;height:${e.end-e.start}px;left:${lane*50+1}%;width:47%`;if(variant==='B')style=`top:${pct(e.start)}%;height:${e.end-e.start}px;left:${lane?38:1}%;width:${lane?61:events.some(other=>other!==e&&other.start<e.end&&other.end>e.start)?35:98}%`;return `<button class="event ${e.kind}" style="${style}" data-event="${i}">${fmt(e.start)}–${fmt(e.end)}<strong>${e.title}</strong></button>`}).join('')}<div class="now"><span></span></div></div></div><div class="details" id="details">点击事项查看时间和来源。示例中的起止时间均为演示设定。</div><div class="state" id="state"></div></section><aside class="panel aside"><h3>时间未明确的内容</h3><p class="muted">保留原有精度，不硬塞到某一分钟。</p><div class="note"><small>下午 · 计划</small>给朋友回消息</div><div class="note"><small>已确认 · 发生时间未记录</small>完成桌面整理</div><p class="muted">这两项不参与时间位置计算。记录时间不等于事情发生时间。</p></aside></div>`;update();document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{let e=events[+b.dataset.event];document.querySelector('#details').textContent=`${e.title} · ${fmt(e.start)}–${fmt(e.end)} · ${e.kind==='plan'?'计划，尚未确认完成':'已确认事实'} · 示例来源：Daily Record`;});}
function update(){document.querySelector('#clockValue').textContent=fmt(now);const line=document.querySelector('.now');line.style[variant==='C'?'left':'top']=pct(now)+'%';line.querySelector('span').textContent='现在 '+fmt(now);document.querySelector('#state').textContent=`演示状态：方案 ${variant} ｜ 模拟时间 ${fmt(now)} ｜ 范围 06:00–23:00 ｜ 计划 6 项，已确认 3 项 ｜ 粗粒度/无时间 2 项 ｜ 仅内存，不读写真实记录`;}
function focusNow(){const s=document.querySelector('.scroller');if(variant==='C')s.scrollLeft=1100*pct(now)/100-s.clientWidth/2;else s.scrollTop=1020*pct(now)/100-s.clientHeight*.52;}
function cycle(d){variant=Object.keys(variants)[(Object.keys(variants).indexOf(variant)+d+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render();focusNow();}
document.querySelector('#clock').oninput=e=>{now=+e.target.value;update()};document.querySelector('#focus').onclick=focusNow;document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();focusNow();
</script></html>
